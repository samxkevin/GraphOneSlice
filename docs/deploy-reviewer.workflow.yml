# Ready-to-enable GitHub Pages workflow template.
# Move this file to .github/workflows/deploy-reviewer.yml from an identity with
# GitHub's workflows permission, then merge to main or run it manually. It is
# deliberately stored as documentation because this Arena GitHub App was
# rejected when it attempted to write an active workflow file.
name: Deploy committed artifact reviewer

on:
  push:
    branches: [main]
    paths:
      - "reviewer_site/**"
      - "data/**"
      - "ResearchPaperSpreadsheetsAvailableForOfflineView/**"
      - "GraphOneSliceSystemArchitecture.pdf"
      - ".github/workflows/deploy-reviewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Assemble static reviewer from committed artifacts
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R reviewer_site/. _site/
          cp -R data _site/data
          mkdir -p "_site/ResearchPaperSpreadsheetsAvailableForOfflineView"
          cp "ResearchPaperSpreadsheetsAvailableForOfflineView/GraphOneSliceResearchPapers(FirstOneThousandEntries).csv" "_site/ResearchPaperSpreadsheetsAvailableForOfflineView/"
          cp GraphOneSliceSystemArchitecture.pdf _site/architecture.pdf
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
